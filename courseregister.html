<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>  DK INSTITUTE Course Registration</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #1e1e2f, #111119);
        color: #fff;
        height: 100vh;
        overflow-y: auto;
    }

    .container {
        max-width: 900px;
        margin: 30px auto;
        padding: 20px;
    }

    h1 {
        text-align: center;
        font-size: 42px;
        margin-bottom: 20px;
        background: linear-gradient(90deg,#ff00ea,#00f2ff);
        -webkit-background-clip: text;
        color: transparent;
        text-shadow: 0px 0px 20px rgba(255,255,255,0.2);
    }

    .glass-card {
        backdrop-filter: blur(12px);
        background: rgba(255, 255, 255, 0.07);
        border-radius: 18px;
        padding: 25px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0px 0px 30px rgba(0,0,0,0.4);
        margin-bottom: 25px;
        transition: 0.4s ease;
    }

    .glass-card:hover {
        transform: translateY(-5px);
        box-shadow: 0px 0px 40px rgba(0,0,0,0.6);
    }

    ul {
        list-style: none;
        padding-left: 0;
        font-size: 18px;
        line-height: 32px;
    }

    .glass-card li {
        padding: 10px;
        background: rgba(255,255,255,0.08);
        border-radius: 10px;
        margin-bottom: 8px;
        transition: .3s;
    }

    .glass-card li:hover {
        background: rgba(255,255,255,0.16);
        transform: scale(1.02);
    }

    input, select {
        width: 100%;
        padding: 12px;
        margin-top: 8px;
        margin-bottom: 15px;
        border-radius: 10px;
        border: none;
        outline: none;
        background: rgba(255,255,255,0.12);
        color: #fff;
        font-size: 16px;
    }

    input::placeholder {
        color: #ccc;
    }

    /* ✅ FIX: Dropdown options visible */
    select option {
        color: #000;
        background: #fff;
    }

    /* Buttons */
    button {
        width: 48%;
        padding: 12px;
        font-size: 16px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(90deg,#00f2ff,#ff00ea);
        transition: 0.3s;
    }

    button:hover {
        transform: scale(1.05);
        box-shadow: 0px 0px 20px rgba(255,255,255,0.5);
    }

    pre {
        background: rgba(0,0,0,0.3);
        padding: 15px;
        border-radius: 12px;
        margin-top: 10px;
        font-size: 14px;
        max-height: 250px;
        overflow-y: auto;
    }
</style>

</head>

<body>

<div class="container">

    <h1>🚀DK INSTITUTE Course Registration Portal</h1>

    <!-- Available Courses -->
    <div class="glass-card">
        <h2>📚 Available Courses</h2>
        <ul>
            <li>Java Fullstack – <b>3 Months</b> – Morning/Evening</li>
            <li>Python Fullstack – <b>3 Months</b> – Morning/Afternoon</li>
            <li>MERN Stack – <b>4 Months</b> – Afternoon/Evening</li>
            <li>AWS Cloud – <b>2 Months</b> – Morning</li>
            <li>UI/UX – <b>3 Months</b> – Evening</li>
        </ul>
    </div>

    
    <div class="glass-card">
        <h2>📝 Registration Form</h2>

        <input id="rno" placeholder="Roll Number">
        <input id="name" placeholder="Student Name">
        <input id="Mobile" placeholder="Mobile">

        <select id="course">
            <option value="Java Fullstack">Java Fullstack</option>
            <option value="Python Fullstack">Python Fullstack</option>
            <option value="MERN Stack">MERN Stack</option>
            <option value="AWS Cloud">AWS Cloud</option>
            <option value="UI/UX">UI/UX</option>
        </select>

        <select id="batchTime">
            <option value="Morning">Morning</option>
            <option value="Afternoon">Afternoon</option>
            <option value="Evening">Evening</option>
        </select>

        <select id="duration">
            <option value="1 Month">1 Month</option>
            <option value="2 Months">2 Months</option>
            <option value="3 Months">3 Months</option>
            <option value="4 Months">4 Months</option>
            <option value="6 Months">6 Months</option>
        </select>

        <div style="display:flex; justify-content:space-between;">
            <button onclick="addStudent()">Register</button>
            <button onclick="getStudents()">Show Students</button>
        </div>

        <pre id="output"></pre>
    </div>

</div>

<script>
    const api = "http://localhost:8080/todoclass";

    function addStudent() {
        const data = {
            rno: document.getElementById("rno").value,
            name: document.getElementById("name").value,
            email: document.getElementById("Mobile").value,
            course: document.getElementById("course").value,
            batchTime: document.getElementById("batchTime").value,
            duration: document.getElementById("duration").value
        };

        fetch(api + "/add", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(data)
        })
        .then(res => res.text())
        .then(text => document.getElementById("output").innerText = text);
    }

    function getStudents() {
        fetch(api + "/getAll")
        .then(res => res.json())
        .then(data => {
            document.getElementById("output").innerText =
                JSON.stringify(data, null, 2);
        });
    }
</script>

</body>
</html>
